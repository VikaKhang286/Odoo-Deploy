services:
  db:
    image: postgres:15-alpine
    container_name: odoo-local-db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo_local_secure_pass
      PGDATA: /var/lib/postgresql/data/pgdata
    command: ["postgres", "-c", "fsync=off"]
    volumes:
      - odoo-db-data:/var/lib/postgresql/data/pgdata
      - ./backups:/backups
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    image: odoo:18.0
    container_name: odoo-local-web
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8069:8069"
      - "127.0.0.1:8072:8072"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo_local_secure_pass
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
      - ./addons:/mnt/extra-addons
      - ./backups:/backups
      - ./logs:/var/log/odoo
    command: ["odoo", "-c", "/etc/odoo/odoo.conf"]
    restart: unless-stopped

volumes:
  odoo-db-data:
  odoo-web-data:
